# Decap CMS configuration for Danuvest
# Docs: https://decapcms.org/docs/configuration-options/
#
# ICON FIELDS ARE `select`, NOT `string`, ON PURPOSE.
# src/components/Icon.astro throws at build time when given a name it does
# not know. If these were free-text, one typo by an editor would break the
# production build with an error they could not interpret. The dropdown makes
# an invalid icon unselectable. When you add an icon to Icon.astro, add its
# name to the relevant `options` list below.
#
# IMAGES: the hero, about and logo images are no longer editable
# here. They now live in src/assets/ and are processed at build time by
# astro:assets (resized, converted to WebP/AVIF, content-hashed). A CMS
# `image` widget writes into public/, which Astro copies verbatim and does
# NOT optimise — that is exactly how this site ended up shipping a 6.3 MB
# JPEG. Alt text stays editable; swapping a photo is a developer task.

backend:
  name: git-gateway
  branch: main

# Use a local proxy server during development (`npm run cms`)
# so editors can preview CMS changes without GitHub credentials.
local_backend: true

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://danuvest.md
display_url: https://danuvest.md
logo_url: /favicon.png

collections:
  - name: "site"
    label: "Site & Navigation"
    delete: false
    editor: { preview: false }
    files:
      - name: "site"
        label: "Site Settings"
        file: "src/data/site.json"
        format: "json"
        fields:
          - { name: brandName, label: "Brand Name", widget: string }
          - { name: brandSplit, label: "Brand Split (use | between two parts)", widget: string, hint: "e.g. DANU|VEST renders DANU + styled VEST" }
          - { name: metaTitle, label: "Meta Title (browser tab)", widget: string }
          - { name: metaDescription, label: "Meta Description (SEO)", widget: text, hint: "Shown in Google results and in WhatsApp/Facebook link previews. Aim for 150-160 characters." }
          - name: navLinks
            label: "Navigation Links"
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: "Anchor / URL", widget: string }
          - { name: ctaLabel, label: "Header CTA Button Label", widget: string }

  - name: "hero"
    label: "Hero Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "hero"
        label: "Hero"
        file: "src/data/hero.json"
        format: "json"
        fields:
          - { name: titleLead, label: "Title — leading text", widget: string }
          - { name: titleAccent, label: "Title — accent (gold) word", widget: string }
          - { name: titleTrail, label: "Title — trailing line", widget: string }
          - { name: subtitle, label: "Subtitle", widget: text }
          - name: ctaPrimary
            label: "Primary CTA"
            widget: object
            fields:
              - { name: label, label: Label, widget: string, hint: "The arrow is drawn by the theme — do not type one." }
              - { name: href, label: "Anchor / URL", widget: string }
          - name: ctaSecondary
            label: "Secondary CTA"
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: "Anchor / URL", widget: string }
          - name: stats
            label: "Stat Cards"
            widget: list
            hint: "Shown on desktop and mobile alike. Only claim numbers you can defend."
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }

  - name: "services"
    label: "Services Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "services"
        label: "Services"
        file: "src/data/services.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: Title, widget: string }
          - name: items
            label: "Service Cards"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [crane, excavator, homes, building, wrench, brush, ruler, trophy, handshake, bolt, check]
              - { name: title, label: Title, widget: string }
              - { name: desc, label: Description, widget: text }

  # PHOTOS ARE NOT EDITABLE HERE, and `slug` must not be changed.
  # Each machine's photograph lives at src/assets/fleet/<slug>.jpg and is
  # processed at build time by astro:assets. The component resolves it from
  # the slug, so editing a slug here breaks the build with "Fleet: missing
  # image". Every file is cut to 5:3, which is also the ratio of the frame
  # on the page — an off-ratio file gets re-cropped by the browser and
  # loses whatever it was framed on. Adding, removing or swapping a machine
  # is a developer task; the order of this list is the order the showcase
  # cycles through, grouped by what the machines do.
  - name: "fleet"
    label: "Fleet Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "fleet"
        label: "Fleet"
        file: "src/data/fleet.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: "Title (use | for line break)", widget: string }
          - { name: description, label: "Intro paragraph", widget: text }
          - { name: note, label: "Footnote under the showcase", widget: text }
          - { name: hintLabel, label: "Badge on the photograph", widget: string, hint: "Use {n} where the number of machines should go, e.g. 'Vezi toate cele {n} utilaje'." }
          - { name: countLabel, label: "Word after the counter", widget: string, hint: "Shown as '01 / 12 <this>'." }
          - { name: openLabel, label: "Gallery button label", widget: string }
          - { name: galleryLabel, label: "Gallery title (for screen readers)", widget: string }
          - { name: ctaLabel, label: "Footer link label", widget: string }
          - { name: ctaHref, label: "Footer link anchor / URL", widget: string }
          - name: items
            label: "Machines"
            widget: list
            summary: "{{fields.name}} — {{fields.model}}"
            fields:
              - { name: slug, label: "Slug (do not change)", widget: string, hint: "Matches the filename in src/assets/fleet/. Changing this breaks the build." }
              - { name: category, label: Category, widget: string, hint: "The small gold tag above the name. Reuse an existing spelling — Terasamente, Manipulare, Ridicare, Procesare, Transport — rather than inventing a sixth wording." }
              - { name: name, label: Name, widget: string, hint: "What the machine is: 'Excavator pe șenile', 'Autobasculantă 8x4'. The make goes in the field below, not here." }
              - { name: model, label: "Make and model", widget: string, hint: "Only what is actually legible on the machine in the photograph. Write the make alone rather than inventing a model number, and do not add tonnages or bucket volumes." }
              - { name: use, label: "What it is used for", widget: text, hint: "One sentence, factual. This is the line under the model on the page." }

  # PHOTOS ARE NOT EDITABLE HERE, and `slug` must not be changed.
  # Each project's photos live in src/assets/projects/<slug>-1.jpg …
  # -4.jpg and are processed at build time by astro:assets. The component
  # resolves them from the slug, so editing a slug here breaks the build
  # with "Projects: missing image". The number of photos must match the
  # number of captions in "Photo captions" — caption 1 belongs to
  # <slug>-1.jpg, which is also the card's cover. Adding or swapping
  # photos is a developer task, and so is the 16:9 crop every one of them
  # is cut to: the card frame is 16:9 as well, so an off-ratio file gets
  # re-cropped by the browser and loses whatever it was framed on.
  - name: "projects"
    label: "Projects Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "projects"
        label: "Projects"
        file: "src/data/projects.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: "Title (use | for line break)", widget: string }
          - { name: description, label: "Intro paragraph", widget: text }
          - { name: note, label: "Footnote under the grid", widget: text }
          - { name: photoLabel, label: "Card label for the photo count", widget: string, hint: "Shown after the number, e.g. '4 foto'" }
          - { name: openLabel, label: "Gallery link label", widget: string }
          - { name: clientLabel, label: "Gallery label before the beneficiary", widget: string, hint: "e.g. Beneficiar. Only shown for projects that have one filled in." }
          - { name: ctaLabel, label: "CTA Button Label", widget: string }
          - { name: ctaHref, label: "CTA Anchor / URL", widget: string }
          - name: items
            label: "Projects"
            widget: list
            summary: "{{fields.name}} — {{fields.place}}"
            fields:
              - { name: slug, label: "Slug (do not change)", widget: string, hint: "Matches the filenames in src/assets/projects/. Changing this breaks the build." }
              - { name: category, label: Category, widget: string, hint: "The small gold tag on the card. Reuse an existing spelling — Comercial, Industrial, Rezidențial, Reconstrucție — rather than inventing a fourth wording for the same thing." }
              - { name: name, label: Name, widget: string, hint: "The type of object, phrased the same way as the others: 'Centru comercial', 'Casă individuală de locuit'. The locality below is what tells two of the same type apart, so do not put it in here." }
              - { name: place, label: Locality, widget: string, hint: "Smaller unit first, then the larger one: 'or. Cricova, mun. Chișinău'." }
              - { name: period, label: Period, widget: string, hint: "e.g. 11.2024 — prezent" }
              - { name: status, label: Status, widget: string, hint: "e.g. În execuție / Finalizat" }
              - { name: client, label: "Beneficiary (optional)", widget: string, required: false, hint: "Shown in the gallery only. Leave empty unless the beneficiary has agreed to be named." }
              - { name: desc, label: Description, widget: text, hint: "Shown in the gallery when someone opens the project. One or two sentences." }
              - { name: scope, label: "Scope of works", widget: list, field: { name: item, label: Item, widget: string }, hint: "Shown in the gallery as small tags. Three or four short items read best." }
              - { name: photos, label: "Photo captions", widget: list, field: { name: caption, label: Caption, widget: string }, hint: "One per photo, in order — four of them. Caption 1 belongs to <slug>-1.jpg, the card cover." }

  - name: "about"
    label: "About Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "about"
        label: "About"
        file: "src/data/about.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: "Title (use | for line break)", widget: string }
          - name: paragraphs
            label: "Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: imageAlt, label: "Image Alt Text", widget: string, hint: "The photo itself is set in code." }

  - name: "contact"
    label: "Contact Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "contact"
        label: "Contact"
        file: "src/data/contact.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - name: info
            label: "Contact Info Cards"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [pin, phone, mail, clock]
              - { name: title, label: Title, widget: string }
              - name: lines
                label: "Lines"
                widget: list
                field: { name: line, label: Line, widget: string }
              - { name: href, label: "Link (optional, e.g. tel: or mailto:)", widget: string, required: false }
          # These replaced the old contact form. The form posted nowhere: it
          # showed a "message sent" confirmation and discarded the enquiry.
          # These are real links, so they cannot fail silently.
          - name: actions
            label: "Direct Contact Buttons"
            widget: list
            hint: "Phone, WhatsApp, Viber and email buttons. Check the href after every edit — a typo here loses enquiries."
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [phone, whatsapp, viber, mail]
              - { name: label, label: "Small label above (e.g. Sună acum)", widget: string }
              - { name: value, label: "Number or address shown", widget: string }
              - { name: href, label: "Link target", widget: string, hint: "tel:+373..., https://wa.me/373..., viber://chat?number=%2B373..., mailto:..." }
              - { name: external, label: "Opens in a new tab", widget: boolean, required: false, default: false, hint: "On for https:// links only. Leave off for tel:, mailto: and viber:." }

  - name: "footer"
    label: "Footer"
    delete: false
    editor: { preview: false }
    files:
      - name: "footer"
        label: "Footer"
        file: "src/data/footer.json"
        format: "json"
        fields:
          # The social block is commented out in Footer.astro because all three
          # links are placeholders. Put real profile URLs in here and ask a
          # developer to uncomment it. Dead social icons read as an abandoned
          # company, which is worse than having none.
          - name: social
            label: "Social Links (not published — needs real URLs)"
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - name: icon
                label: Icon
                widget: select
                options: [facebook, instagram, linkedin]
              - { name: href, label: URL, widget: string }
          - name: contactItems
            label: "Contact Items"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [pin, phone, mail, clock]
              - { name: text, label: Text, widget: string }
              - { name: href, label: "Link (optional)", widget: string, required: false }
          - { name: copyright, label: "Copyright Line", widget: string }
