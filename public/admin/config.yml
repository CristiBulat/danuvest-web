# Decap CMS configuration for Danuvest
# Docs: https://decapcms.org/docs/configuration-options/
#
# ICON FIELDS ARE `select`, NOT `string`, ON PURPOSE.
# src/components/Icon.astro throws at build time when given a name it does
# not know. If these were free-text, one typo by an editor would break the
# production build with an error they could not interpret. The dropdown makes
# an invalid icon unselectable. When you add an icon to Icon.astro, add its
# name to the relevant `options` list below.
#
# IMAGES: the hero, mission, about and logo images are no longer editable
# here. They now live in src/assets/ and are processed at build time by
# astro:assets (resized, converted to WebP/AVIF, content-hashed). A CMS
# `image` widget writes into public/, which Astro copies verbatim and does
# NOT optimise — that is exactly how this site ended up shipping a 6.3 MB
# JPEG. Alt text stays editable; swapping a photo is a developer task.

backend:
  name: git-gateway
  branch: main

# Use a local proxy server during development (`npm run cms`)
# so editors can preview CMS changes without GitHub credentials.
local_backend: true

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://danuvest.md
display_url: https://danuvest.md
logo_url: /favicon.png

collections:
  - name: "site"
    label: "Site & Navigation"
    delete: false
    editor: { preview: false }
    files:
      - name: "site"
        label: "Site Settings"
        file: "src/data/site.json"
        format: "json"
        fields:
          - { name: brandName, label: "Brand Name", widget: string }
          - { name: brandSplit, label: "Brand Split (use | between two parts)", widget: string, hint: "e.g. DANU|VEST renders DANU + styled VEST" }
          - { name: metaTitle, label: "Meta Title (browser tab)", widget: string }
          - { name: metaDescription, label: "Meta Description (SEO)", widget: text, hint: "Shown in Google results and in WhatsApp/Facebook link previews. Aim for 150-160 characters." }
          - name: navLinks
            label: "Navigation Links"
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: "Anchor / URL", widget: string }
          - { name: ctaLabel, label: "Header CTA Button Label", widget: string }

  - name: "hero"
    label: "Hero Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "hero"
        label: "Hero"
        file: "src/data/hero.json"
        format: "json"
        fields:
          - { name: badge, label: "Badge Text", widget: string }
          - { name: titleLead, label: "Title — leading text", widget: string }
          - { name: titleAccent, label: "Title — accent (gold) word", widget: string }
          - { name: titleTrail, label: "Title — trailing line", widget: string }
          - { name: subtitle, label: "Subtitle", widget: text }
          - name: ctaPrimary
            label: "Primary CTA"
            widget: object
            fields:
              - { name: label, label: Label, widget: string, hint: "The arrow is drawn by the theme — do not type one." }
              - { name: href, label: "Anchor / URL", widget: string }
          - name: ctaSecondary
            label: "Secondary CTA"
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: "Anchor / URL", widget: string }
          - name: trust
            label: "Trust Bullets"
            widget: list
            field: { name: text, label: Bullet, widget: string }
          - name: stats
            label: "Stat Cards"
            widget: list
            hint: "Shown on desktop and mobile alike. Only claim numbers you can defend."
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }

  - name: "mission"
    label: "Mission Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "mission"
        label: "Mission"
        file: "src/data/mission.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: "Title (use | for line break)", widget: string }
          - { name: imageAlt, label: "Image Alt Text", widget: string, hint: "Describes the photo for screen readers and search engines. The photo itself is set in code." }
          - { name: badgeValue, label: "Badge Value (e.g. 500+)", widget: string }
          - { name: badgeText, label: "Badge Text", widget: string }
          - { name: quote, label: "Mission Quote", widget: text }
          - { name: description, label: "Description", widget: text }
          - name: values
            label: "Company Values"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [trophy, handshake, bolt, check, crane, homes, building, wrench, brush, ruler]
              - { name: title, label: Title, widget: string }

  - name: "services"
    label: "Services Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "services"
        label: "Services"
        file: "src/data/services.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - name: items
            label: "Service Cards"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [crane, homes, building, wrench, brush, ruler, trophy, handshake, bolt, check]
              - { name: title, label: Title, widget: string }
              - { name: desc, label: Description, widget: text }

  # NOT CURRENTLY ON THE SITE.
  # This section is fully built but deliberately not rendered: its entries are
  # stock photographs with invented project names, which cannot be published
  # under the heading "Proiectele noastre". Replace every entry with a real
  # completed project — real photo, real name, real year — and then ask a
  # developer to switch the section on in src/pages/index.astro.
  - name: "projects"
    label: "Projects Section (not published)"
    delete: false
    editor: { preview: false }
    files:
      - name: "projects"
        label: "Projects"
        file: "src/data/projects.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - { name: ctaLabel, label: "CTA Button Label", widget: string }
          - { name: ctaHref, label: "CTA Anchor / URL", widget: string }
          - name: items
            label: "Project Cards"
            widget: list
            fields:
              - { name: img, label: "Image URL", widget: string }
              - { name: category, label: Category, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: desc, label: Description, widget: text }

  - name: "about"
    label: "About Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "about"
        label: "About"
        file: "src/data/about.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: "Title (use | for line break)", widget: string }
          - name: paragraphs
            label: "Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - name: stats
            label: "Stats"
            widget: list
            fields:
              - { name: num, label: Number, widget: string }
              - { name: text, label: Label, widget: string }
          - { name: imageAlt, label: "Image Alt Text", widget: string, hint: "The photo itself is set in code." }
          - { name: experienceNum, label: "Experience Number", widget: string }
          - { name: experienceText, label: "Experience Label", widget: string }

  - name: "contact"
    label: "Contact Section"
    delete: false
    editor: { preview: false }
    files:
      - name: "contact"
        label: "Contact"
        file: "src/data/contact.json"
        format: "json"
        fields:
          - { name: label, label: "Section label", widget: string }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - name: info
            label: "Contact Info Cards"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [pin, phone, mail, clock]
              - { name: title, label: Title, widget: string }
              - name: lines
                label: "Lines"
                widget: list
                field: { name: line, label: Line, widget: string }
              - { name: href, label: "Link (optional, e.g. tel: or mailto:)", widget: string, required: false }
          # These replaced the old contact form. The form posted nowhere: it
          # showed a "message sent" confirmation and discarded the enquiry.
          # These are real links, so they cannot fail silently.
          - name: actions
            label: "Direct Contact Buttons"
            widget: list
            hint: "Phone, WhatsApp, Viber and email buttons. Check the href after every edit — a typo here loses enquiries."
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [phone, whatsapp, viber, mail]
              - { name: label, label: "Small label above (e.g. Sună acum)", widget: string }
              - { name: value, label: "Number or address shown", widget: string }
              - { name: href, label: "Link target", widget: string, hint: "tel:+373..., https://wa.me/373..., viber://chat?number=%2B373..., mailto:..." }
              - { name: primary, label: "Emphasised (dark) style", widget: boolean, required: false, default: false }
              - { name: external, label: "Opens in a new tab", widget: boolean, required: false, default: false, hint: "On for https:// links only. Leave off for tel:, mailto: and viber:." }

  - name: "footer"
    label: "Footer"
    delete: false
    editor: { preview: false }
    files:
      - name: "footer"
        label: "Footer"
        file: "src/data/footer.json"
        format: "json"
        fields:
          - { name: tagline, label: Tagline, widget: text }
          # The social block is commented out in Footer.astro because all three
          # links are placeholders. Put real profile URLs in here and ask a
          # developer to uncomment it. Dead social icons read as an abandoned
          # company, which is worse than having none.
          - name: social
            label: "Social Links (not published — needs real URLs)"
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - name: icon
                label: Icon
                widget: select
                options: [facebook, instagram, linkedin]
              - { name: href, label: URL, widget: string }
          - { name: navTitle, label: "Nav Column Title", widget: string }
          - name: navLinks
            label: "Nav Column Links"
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: "Anchor / URL", widget: string }
          - { name: servicesTitle, label: "Services Column Title", widget: string }
          - name: serviceLinks
            label: "Services Column Links"
            widget: list
            field: { name: name, label: Service, widget: string }
          - { name: contactTitle, label: "Contact Column Title", widget: string }
          - name: contactItems
            label: "Contact Items"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [pin, phone, mail, clock]
              - { name: text, label: "Text (use | for line break)", widget: string }
              - { name: href, label: "Link (optional)", widget: string, required: false }
          - { name: copyright, label: "Copyright Line", widget: string }
