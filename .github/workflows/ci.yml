name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo or deploys anywhere.
permissions:
  contents: read

jobs:
  build:
    name: Type-check, build, and guard page weight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # .nvmrc is the single source of truth for the Node version, shared with
      # deploy-pages.yml and deploy-netlify.yml. Keep netlify.toml's
      # build.environment.NODE_VERSION in step with it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # This project previously shipped a 12 MB dist/, almost all of it two
      # unresized JPEGs (one was 9360x6240, displayed at 327px wide on a
      # phone). That is the single regression most likely to come back — a
      # well-meaning editor drops a photo straight off a DSLR into the repo
      # and nothing complains. This guard is here specifically to complain.
      #
      # It used to complain by capping dist/ at 2048 KB, which worked while
      # the site had two photographs in it. The Proiecte section put 24 site
      # photos in src/assets/, and astro:assets emits several derivatives of
      # each — so dist/ now holds far more than any one visitor downloads:
      # the browser picks a single width out of each srcset, and the 24
      # gallery images load only when someone opens a lightbox.
      #
      # So the cap that actually catches the original regression is the
      # per-file one. A correctly resized derivative of a site photo lands
      # around 100-200 KB; anything past 450 KB has skipped astro:assets.
      # The total is kept as a second, looser tripwire against the portfolio
      # growing without anyone looking at the numbers.
      - name: Guard total page weight
        run: |
          TOTAL_LIMIT_KB=7168
          FILE_LIMIT_KB=450
          SIZE_KB=$(du -sk dist | cut -f1)
          echo "dist/ is ${SIZE_KB} KB (limit ${TOTAL_LIMIT_KB} KB)"
          echo ""
          echo "10 largest files:"
          find dist -type f -exec du -k {} + | sort -rn | head -10 \
            | awk '{printf "  %6s KB  %s\n", $1, $2}'
          echo ""

          FAIL=0

          OVERSIZED=$(find dist -type f -exec du -k {} + \
            | awk -v lim="$FILE_LIMIT_KB" '$1 > lim {print}')
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files over the ${FILE_LIMIT_KB} KB per-file budget:"
            echo "$OVERSIZED" | awk '{printf "  %6s KB  %s\n", $1, $2}'
            echo "Large images belong in src/assets/ and must be rendered with"
            echo "astro:assets (<Image />), which emits resized WebP/AVIF."
            echo "Files dropped into public/ are copied verbatim, unoptimized."
            FAIL=1
          fi

          if [ "$SIZE_KB" -gt "$TOTAL_LIMIT_KB" ]; then
            echo "::error::dist/ is ${SIZE_KB} KB, over the ${TOTAL_LIMIT_KB} KB budget."
            echo "If this is the portfolio growing rather than one bad file,"
            echo "drop the widths or the quality in Projects.astro before"
            echo "raising this number."
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "Within budget."
